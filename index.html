```html
<!DOCTYPE html>
<html>
<head>
    <title>AI Study Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #4CAF50;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 AI Study Planner</h1>

        <p class="subtitle">
            Create your personalized study plan
        </p>

        <form action="/generate" method="POST">

            <label>📖 Subjects</label>

            <input
                type="text"
                name="subjects"
                placeholder="Python, DBMS, OS"
                required
            >

            <label>⏰ Study Hours Per Day</label>

            <input
                type="number"
                name="hours"
                placeholder="Example: 4"
                min="1"
                max="24"
                step="0.5"
                required
            >

            <label>📅 Exam Date</label>

            <input
                type="date"
                name="exam_date"
                required
            >

            <label>🎯 Difficulty Level</label>

            <select name="difficulty" required>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>

            <button type="submit">
                🚀 Generate Study Plan
            </button>

        </form>

    </div>

</body>
</html>
```
